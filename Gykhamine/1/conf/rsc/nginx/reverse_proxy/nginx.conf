user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
    use epoll;
}

http {
    # --- Sécurité Globale ---
    server_tokens off; # Cache la version de Nginx pour la discrétion
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # --- Optimisations Réseau ---
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # --- Compression Gzip (Performance) ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/conf.d/*.conf;

    # --- Redirection HTTP vers HTTPS ---
    server {
        listen       80;
        server_name  localhost;
    }

    # --- Configuration Serveur Sécurisé (TLS) ---
    server {
        listen       443 ssl http2;
        server_name  Gykhamine.cg;

        # Certificats SSL
        ssl_certificate "/etc/pki/nginx/server.crt";
        ssl_certificate_key "/etc/pki/nginx/private/server.key";

        # Protocoles et Ciphers Modernes (Sécurité renforcée)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Headers de Sécurité ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- Fichiers Statiques ---
        location /static/ {
            alias /chemin/vers/ton/projet/static/; # À adapter
            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # --- Fichiers Media (Sécurisés) ---
        location /media/ {
            alias /chemin/vers/ton/projet/media/; # À adapter
            # Empêche l'exécution de scripts malveillants uploadés
            location ~* \.(php|py|pl|sh|cgi|exe)$ {
                deny all;
            }
        }

        # --- Proxy vers Gunicorn ---
        location / {
            proxy_pass http://127.0.0.1:8000;
            
            # Transmission correcte des informations client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Limite la taille des uploads (ex: 20 Mo)
            client_max_body_size 20M;
        }

        # Interdire l'accès aux fichiers cachés (.env, .git, etc.)
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
